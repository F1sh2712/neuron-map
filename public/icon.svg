<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#1c1f3a"/>
      <stop offset="100%" stop-color="#0d0f1f"/>
    </radialGradient>
    <radialGradient id="bodyGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%"   stop-color="#1e2450" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d0f1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldCore" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="20%"  stop-color="#fef9c3"/>
      <stop offset="55%"  stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background (app icon style) -->
  <rect x="0" y="0" width="120" height="120" rx="24" ry="24" fill="url(#bg)"/>

  <!-- Ripple rings (aura / 灵气波动) -->
  <circle cx="60" cy="72" r="50" fill="none" stroke="#2a2f58" stroke-width="0.8" opacity="0.7"/>
  <circle cx="60" cy="72" r="41" fill="none" stroke="#303566" stroke-width="0.9" opacity="0.7"/>
  <circle cx="60" cy="72" r="32" fill="none" stroke="#383d74" stroke-width="1"   opacity="0.75"/>

  <!-- Dark oval glow behind the figure body -->
  <ellipse cx="60" cy="74" rx="36" ry="30" fill="url(#bodyGlow)"/>

  <!-- ===== BODY EDGES (lines behind nodes) ===== -->
  <!-- Edge color: soft blue #60a5fa, thin -->

  <!-- Neck: head-ring bottom nodes → top chest node -->
  <line x1="55" y1="41" x2="57" y2="48" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.75"/>
  <line x1="65" y1="41" x2="63" y2="48" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.75"/>

  <!-- Top chest → left shoulder, right shoulder -->
  <line x1="60" y1="48" x2="47" y2="55" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.8"/>
  <line x1="60" y1="48" x2="73" y2="55" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.8"/>

  <!-- Shoulders → inner chest nodes -->
  <line x1="47" y1="55" x2="55" y2="57" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.8"/>
  <line x1="73" y1="55" x2="65" y2="57" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.8"/>

  <!-- Shoulders ↔ inner (cross braces) -->
  <line x1="47" y1="55" x2="65" y2="57" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.55"/>
  <line x1="73" y1="55" x2="55" y2="57" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.55"/>

  <!-- Shoulders → outer arms / outer mid -->
  <line x1="47" y1="55" x2="38" y2="65" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.75"/>
  <line x1="73" y1="55" x2="82" y2="65" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.75"/>

  <!-- Inner chest → golden orb -->
  <line x1="55" y1="57" x2="60" y2="67" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.8"/>
  <line x1="65" y1="57" x2="60" y2="67" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.8"/>

  <!-- Shoulders → golden orb (outer diagonals) -->
  <line x1="47" y1="55" x2="60" y2="67" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.65"/>
  <line x1="73" y1="55" x2="60" y2="67" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.65"/>

  <!-- Outer arms → lower outer nodes -->
  <line x1="38" y1="65" x2="44" y2="78" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.75"/>
  <line x1="82" y1="65" x2="76" y2="78" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.75"/>

  <!-- Golden orb → lower nodes -->
  <line x1="60" y1="67" x2="44" y2="78" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.75"/>
  <line x1="60" y1="67" x2="76" y2="78" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.75"/>
  <line x1="60" y1="67" x2="60" y2="82" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.75"/>

  <!-- Lower cross edges -->
  <line x1="44" y1="78" x2="60" y2="82" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.7"/>
  <line x1="76" y1="78" x2="60" y2="82" stroke="#60a5fa" stroke-width="0.9" stroke-opacity="0.7"/>
  <line x1="44" y1="78" x2="76" y2="78" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.55"/>

  <!-- Outer lower → outermost lotus nodes -->
  <line x1="44" y1="78" x2="36" y2="82" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.65"/>
  <line x1="76" y1="78" x2="84" y2="82" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.65"/>
  <line x1="36" y1="82" x2="60" y2="82" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.55"/>
  <line x1="84" y1="82" x2="60" y2="82" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.55"/>

  <!-- ===== HEAD RING ===== -->
  <!-- 8-node polygon centered at (60, 28), r=12 -->
  <!-- angles: 90°top, then every 45° -->
  <!-- nodes: top(60,16), top-right(68.5,19.5), right(72,28), bottom-right(68.5,36.5), bottom(60,40), bottom-left(51.5,36.5), left(48,28), top-left(51.5,19.5) -->
  <polygon
    points="60,16 68.5,19.5 72,28 68.5,36.5 60,40 51.5,36.5 48,28 51.5,19.5"
    fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.75"
    filter="url(#glowSm)"/>

  <!-- HEAD ring nodes (8 dots) -->
  <circle cx="60"   cy="16"   r="2.3" fill="#bfdbfe" filter="url(#glowSm)"/>
  <circle cx="68.5" cy="19.5" r="2.3" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="72"   cy="28"   r="2.3" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="68.5" cy="36.5" r="2.3" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="60"   cy="40"   r="2.3" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="51.5" cy="36.5" r="2.3" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="48"   cy="28"   r="2.3" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="51.5" cy="19.5" r="2.3" fill="#93c5fd" filter="url(#glowSm)"/>

  <!-- ===== BODY NODES ===== -->
  <!-- Top chest (below neck) -->
  <circle cx="60" cy="48" r="2.5" fill="#93c5fd" filter="url(#glowSm)"/>

  <!-- Shoulders -->
  <circle cx="47" cy="55" r="2.5" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="73" cy="55" r="2.5" fill="#93c5fd" filter="url(#glowSm)"/>

  <!-- Inner chest -->
  <circle cx="55" cy="57" r="2.3" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="65" cy="57" r="2.3" fill="#93c5fd" filter="url(#glowSm)"/>

  <!-- Outer arms / mid -->
  <circle cx="38" cy="65" r="2.5" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="82" cy="65" r="2.5" fill="#93c5fd" filter="url(#glowSm)"/>

  <!-- Lower nodes -->
  <circle cx="44" cy="78" r="2.5" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="76" cy="78" r="2.5" fill="#93c5fd" filter="url(#glowSm)"/>
  <circle cx="60" cy="82" r="2.5" fill="#93c5fd" filter="url(#glowSm)"/>

  <!-- Outermost lotus base nodes -->
  <circle cx="36" cy="82" r="2.2" fill="#7dd3fc" filter="url(#glowSm)"/>
  <circle cx="84" cy="82" r="2.2" fill="#7dd3fc" filter="url(#glowSm)"/>

  <!-- ===== GOLDEN ORB (丹田 / golden core) ===== -->
  <!-- Outer ambient glow -->
  <circle cx="60" cy="67" r="16" fill="#f59e0b" opacity="0.08" filter="url(#glowLg)"/>
  <circle cx="60" cy="67" r="11" fill="#f59e0b" opacity="0.18" filter="url(#glowLg)"/>
  <!-- Main orb -->
  <circle cx="60" cy="67" r="7.5" fill="url(#goldCore)" filter="url(#glowMd)"/>
  <!-- Bright center -->
  <circle cx="60" cy="67" r="3"   fill="#fffbeb"/>
  <circle cx="60" cy="67" r="1.4" fill="#ffffff"/>
</svg>
