<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d0516"/>
    </radialGradient>
    <radialGradient id="nodeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Brain silhouette (subtle organic outline) -->
  <path d="M38 72 C28 68 22 58 24 48 C25 40 30 34 36 32 C38 26 44 22 50 24 C53 20 58 18 62 20 C66 17 73 18 76 23 C82 22 88 27 89 34 C95 36 99 44 97 52 C100 58 98 68 90 73 C88 80 82 84 76 83 C73 88 67 90 62 88 C57 91 50 90 46 85 C41 86 35 82 38 72 Z"
        fill="none" stroke="#4c1d95" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Brain fold lines (decorative) -->
  <path d="M46 35 C50 32 55 33 58 37" fill="none" stroke="#6d28d9" stroke-width="0.8" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M62 30 C67 28 72 31 73 36" fill="none" stroke="#6d28d9" stroke-width="0.8" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M36 55 C33 50 35 44 39 42" fill="none" stroke="#6d28d9" stroke-width="0.8" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Skill tree edges (drawn first, behind nodes) -->
  <!-- Root to tier 1 -->
  <line x1="60" y1="55" x2="42" y2="42" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.7" filter="url(#glow)"/>
  <line x1="60" y1="55" x2="60" y2="38" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.7" filter="url(#glow)"/>
  <line x1="60" y1="55" x2="78" y2="42" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.7" filter="url(#glow)"/>

  <!-- Tier 1 to tier 2 -->
  <line x1="42" y1="42" x2="33" y2="58" stroke="#0891b2" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="42" y1="42" x2="50" y2="62" stroke="#0891b2" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="60" y1="38" x2="60" y2="60" stroke="#0891b2" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="78" y1="42" x2="70" y2="62" stroke="#0891b2" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="78" y1="42" x2="86" y2="57" stroke="#0891b2" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Tier 2 to tier 3 -->
  <line x1="33" y1="58" x2="30" y2="72" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.5"/>
  <line x1="50" y1="62" x2="45" y2="75" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.5"/>
  <line x1="60" y1="60" x2="60" y2="75" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.5"/>
  <line x1="70" y1="62" x2="74" y2="75" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.5"/>
  <line x1="86" y1="57" x2="89" y2="71" stroke="#6d28d9" stroke-width="0.9" stroke-opacity="0.5"/>

  <!-- Cross-links (like brain connections) -->
  <line x1="50" y1="62" x2="60" y2="60" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4" stroke-dasharray="2,2"/>
  <line x1="60" y1="60" x2="70" y2="62" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4" stroke-dasharray="2,2"/>
  <line x1="33" y1="58" x2="42" y2="42" stroke="#a78bfa" stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="2,3"/>

  <!-- ROOT node (gold / center) -->
  <circle cx="60" cy="55" r="7" fill="#1a0a2e"/>
  <circle cx="60" cy="55" r="7" fill="url(#nodeGold)" filter="url(#glowStrong)"/>
  <circle cx="60" cy="55" r="3" fill="#fde68a" filter="url(#glowStrong)"/>

  <!-- Tier 1 nodes (purple) -->
  <circle cx="42" cy="42" r="5" fill="#1a0a2e"/>
  <circle cx="42" cy="42" r="5" fill="url(#nodeCore)" filter="url(#glow)"/>
  <circle cx="42" cy="42" r="2" fill="#c4b5fd"/>

  <circle cx="60" cy="38" r="5" fill="#1a0a2e"/>
  <circle cx="60" cy="38" r="5" fill="url(#nodeCore)" filter="url(#glow)"/>
  <circle cx="60" cy="38" r="2" fill="#c4b5fd"/>

  <circle cx="78" cy="42" r="5" fill="#1a0a2e"/>
  <circle cx="78" cy="42" r="5" fill="url(#nodeCore)" filter="url(#glow)"/>
  <circle cx="78" cy="42" r="2" fill="#c4b5fd"/>

  <!-- Tier 2 nodes (cyan) -->
  <circle cx="33" cy="58" r="4" fill="#1a0a2e"/>
  <circle cx="33" cy="58" r="4" fill="url(#nodeCyan)" filter="url(#glow)"/>
  <circle cx="33" cy="58" r="1.5" fill="#a5f3fc"/>

  <circle cx="50" cy="62" r="4" fill="#1a0a2e"/>
  <circle cx="50" cy="62" r="4" fill="url(#nodeCyan)" filter="url(#glow)"/>
  <circle cx="50" cy="62" r="1.5" fill="#a5f3fc"/>

  <circle cx="60" cy="60" r="4" fill="#1a0a2e"/>
  <circle cx="60" cy="60" r="4" fill="url(#nodeCyan)" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="1.5" fill="#a5f3fc"/>

  <circle cx="70" cy="62" r="4" fill="#1a0a2e"/>
  <circle cx="70" cy="62" r="4" fill="url(#nodeCyan)" filter="url(#glow)"/>
  <circle cx="70" cy="62" r="1.5" fill="#a5f3fc"/>

  <circle cx="86" cy="57" r="4" fill="#1a0a2e"/>
  <circle cx="86" cy="57" r="4" fill="url(#nodeCyan)" filter="url(#glow)"/>
  <circle cx="86" cy="57" r="1.5" fill="#a5f3fc"/>

  <!-- Tier 3 nodes (smaller, dim purple) -->
  <circle cx="30" cy="72" r="3" fill="#1a0a2e"/>
  <circle cx="30" cy="72" r="3" fill="url(#nodeCore)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="30" cy="72" r="1.2" fill="#ddd6fe"/>

  <circle cx="45" cy="75" r="3" fill="#1a0a2e"/>
  <circle cx="45" cy="75" r="3" fill="url(#nodeCore)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="45" cy="75" r="1.2" fill="#ddd6fe"/>

  <circle cx="60" cy="75" r="3" fill="#1a0a2e"/>
  <circle cx="60" cy="75" r="3" fill="url(#nodeCore)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="60" cy="75" r="1.2" fill="#ddd6fe"/>

  <circle cx="74" cy="75" r="3" fill="#1a0a2e"/>
  <circle cx="74" cy="75" r="3" fill="url(#nodeCore)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="74" cy="75" r="1.2" fill="#ddd6fe"/>

  <circle cx="89" cy="71" r="3" fill="#1a0a2e"/>
  <circle cx="89" cy="71" r="3" fill="url(#nodeCore)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="89" cy="71" r="1.2" fill="#ddd6fe"/>
</svg>
